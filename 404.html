<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | Jumping Panda</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#141414;font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;padding:32px 22px;position:relative;overflow:hidden}
  body::before{content:"";position:absolute;top:-160px;right:-160px;width:560px;height:560px;background:radial-gradient(circle,rgba(228,91,143,.22),rgba(228,91,143,0) 70%);pointer-events:none}
  main{position:relative;max-width:560px;text-align:center}
  img{height:64px;width:auto}
  .code{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(88px,22vw,150px);line-height:1;letter-spacing:-.04em;color:#e45b8f;margin:18px 0 0}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1.05;letter-spacing:-.03em;margin:6px 0 0}
  p{font-size:17px;line-height:1.55;color:#3c3a37;margin:14px auto 0;max-width:30em}
  .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
  a.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:16px;padding:14px 26px;border-radius:999px;border:2px solid #141414;transition:transform .2s}
  a.btn:hover{transform:translateY(-2px)}
  a.primary{background:#e45b8f;color:#141414;box-shadow:0 4px 0 #141414}
  a.ghost{background:transparent;color:#141414}
</style>
</head>
<body>
<main>
  <a href="/"><img src="/logo-ink.svg" alt="Jumping Panda"></a>
  <div class="code">404</div>
  <h1>Esta página se fue de paseo.</h1>
  <p>No encontramos lo que buscabas. Puede que el enlace haya cambiado, pero te ayudamos a volver al camino.</p>
  <div class="btns">
    <a class="btn primary" href="/">Ir al inicio</a>
    <a class="btn ghost" href="/blog/">Ver el blog</a>
    <a class="btn ghost" href="/#contacto">Agenda tu diagnóstico</a>
  </div>
</main>
</body>
</html>
